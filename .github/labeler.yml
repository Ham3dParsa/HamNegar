# Labeler configuration for HamNegar
# Maps PR title patterns and file paths to type/, area/, priority/ labels.
# See AGENTS.md §1 for module seams and the labeling audit proposal.
# Syntax: actions/labeler v4 — uses 'title:' and 'path:' qualifiers.
# Note: title regex patterns use single quotes to avoid YAML escape issues.

# --- Type labels (from PR title prefix) ---
"type/feat":
  - 'title: /^feat(\(.*\))?: /'

"type/fix":
  - 'title: /^fix(\(.*\))?: /'

"type/refactor":
  - 'title: /^refactor(\(.*\))?: /'

"type/style":
  - 'title: /^style(\(.*\))?: /'

"type/perf":
  - 'title: /^perf(\(.*\))?: /'

"type/chore":
  - 'title: /^chore(\(.*\))?: /'
  - 'path: **/temp/'

"type/docs":
  - 'title: /^docs(\(.*\))?: /'
  - 'path: **/docs/'
  - 'path: **/tickets/'
  - 'path: **/CHANGELOG.md'

"type/test":
  - 'title: /^test(\(.*\))?: /'

# --- Priority labels (for type/fix PRs only) ---
# critical: security/data loss/broken auth/fallback chain
"priority/critical":
  - 'title: /^fix.*(auth|security|secret|breach|cors|leak|exploit|bypass|inject|data[ ._-]?loss)/'

# high: bug affecting core transcription/recording/audio/realtime flow
"priority/high":
  - 'title: /^fix.*(transcript|transcription|recording|audio|realtime|stream|mic|pipeline|buffer|chunk|engine|stt|polish|fallback|quota)/'

# medium: minor UI bug, settings, stagebar, mobile, ci, non-core functionality
"priority/medium":
  - 'title: /^fix.*(settings|stagebar|wave|button|icon|css|class|color|font|size|margin|padding|scroll|layout|modal|drawer|sheet|panel|tab|nav|menu|tooltip|hover|focus|align|position|z-index|ui|ci|mobile)/'

# low: cosmetic, minor layout, docs, minor
"priority/low":
  - 'title: /^fix.*(whitespace|indent|comment|doc|readme|typo|format|lint|spell|grammar|minor|trivial|cosmetic)/'

# --- Area labels (from file paths changed) ---
