# Labeler configuration for HamNegar (file-path based)
# Title-based type/ and priority/ labels are handled in .github/workflows/labeler.yml.
# See AGENTS.md §1 for module seams.

# --- Type labels (from file paths changed) ---
"type/chore":
  - '**/temp/**'

"type/docs":
  - '**/docs/**'
  - '**/tickets/**'
  - '**/CHANGELOG.md'

# --- Area labels (from file paths changed) ---
"area/storage":
  - '**/js/modules/storage.js'
  - '**/js/modules/stats.js'
  - '**/js/modules/stats.test.mjs'
  - '**/.env.example'

"area/transcription":
  - '**/js/modules/transcription.js'
  - '**/js/modules/provider.js'

"area/audio":
  - '**/js/modules/audio.js'

"area/realtime":
  - '**/js/modules/realtime.js'

"area/quota":
  - '**/js/modules/quota.js'
  - '**/js/modules/quota-badge.js'

"area/logger":
  - '**/js/modules/logger.js'

"area/wave":
  - '**/js/modules/wave.js'
  - '**/js/modules/waveTab.js'

"area/stagebar":
  - '**/js/modules/stagebar.js'

"area/settings":
  - '**/js/modules/settingsModal.js'

"area/shell":
  - '**/js/modules/shell.js'

"area/chains":
  - '**/js/modules/chains.js'

"area/pill":
  - '**/js/modules/pill.js'

"area/guide":
  - '**/js/modules/guide.js'

"area/ui":
  - '**/css/app.css'
  - '**/pill.css'
  - '**/index.html'
  - '**/pill.html'
  - '**/js/app.js'
  - '**/js/modules/dom.js'
  - '**/js/modules/format.js'
  - '**/js/modules/dashboard.js'

"area/desktop":
  - '**/desktop/**'

"area/ci":
  - '**/.github/workflows/**'
  - '**/.opencode/**'

"area/docs":
  - '**/docs/**'
  - '**/tickets/**'

"area/repo":
  - '**/js/modules/version.js'
  - '**/CHANGELOG.md'
  - '**/VERSION'
  - '**/.gitignore'
  - '**/.github/PULL_REQUEST_TEMPLATE.md'
