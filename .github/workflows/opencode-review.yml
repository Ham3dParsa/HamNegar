name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  id-token: write

jobs:
  review:
    # Rule 1 & 4: only ready PRs, skip bots & forks (secrets not passed on forks)
    # Bot-loop guard: review pushes an APPROVED co-authored commit which
    # re-triggers synchronize with actor opencode-agent[bot]; without this
    # the 2nd run fails with "does not have write permissions" (PR #127/#128).
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'opencode-agent[bot]' &&
      github.actor != 'kilo-code-bot[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_KILO: ${{ secrets.KILO_API_KEY != '' && '1' || '0' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REVIEW_PROMPT: |
        You are the HamNegar PR reviewer (تایپ صوتی). Be STRICT: flag all potential issues, prioritize quality and security.
        PR Gate Threshold is "Warnings and above" — mark every finding as 🔴 [critical], 🟡 [warning], or 🔵 [info]. Fail the check if any [critical] or [warning] exists.

        Speed & Scope:
        - First inspect `git diff origin/main...HEAD` and read `./REVIEW.md` from base (`git show origin/main:REVIEW.md`) — focus only on changed files and their direct callers (1..11 traps in `REVIEW.md`). Keep your review fast and concise.

        Submission mode:
        - Let the OpenCode GitHub runner post your final output directly (do NOT run `gh api` or `gh pr review` manually).
        - Update the existing opencode-agent summary comment in place; never post a duplicate summary.
        - Where a direct single-hunk code fix is clear, include a ```suggestion``` block under that finding.

        Output format (concise, scannable, human + agent readable):
        ### ✅ APPROVED  *(or)*  ### ⚠️ REQUEST_CHANGES
        > Summary: N 🔴 critical, M 🟡 warning, K 🔵 info

        **🚨 Must fix before merge:**
        - [ ] `file_path:line_number` 🔴 `[critical]` / 🟡 `[warning]` description — positive fix

        **💡 Optional / defer:**
        - [ ] `file_path:line_number` 🔵 `[info]` description — defer reason

        **🛡️ Traps checked:** list `REVIEW.md` traps verified (or "none relevant")
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: rev1
        name: Review (1/4 — Zen DeepSeek v4.1 Flash Free)
        continue-on-error: true
        timeout-minutes: 5
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4.1-flash-free
          prompt: |
            ${{ env.REVIEW_PROMPT }}

            End your comment with this exact footnote:
            ---
            > 🤖 **Reviewer:** `opencode/deepseek-v4.1-flash-free` (`1/4`) · ⏱️ **Duration:** `<approx elapsed or N/A>` · 🪙 **Tokens:** `<count if exposed, else N/A>`

      - id: rev2
        name: Review (2/4 — Zen HY 4 Flash Free)
        if: steps.rev1.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 5
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/hy4-flash-free
          prompt: |
            ${{ env.REVIEW_PROMPT }}

            End your comment with this exact footnote:
            ---
            > 🤖 **Reviewer:** `opencode/hy4-flash-free` (`2/4`) · ⏱️ **Duration:** `<approx elapsed or N/A>` · 🪙 **Tokens:** `<count if exposed, else N/A>`

      - id: rev3
        name: Review (3/4 — Kilo Ling 3.2 Flash Free)
        if: steps.rev1.outcome != 'success' && steps.rev2.outcome != 'success' && env.HAS_KILO == '1'
        continue-on-error: true
        timeout-minutes: 5
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        with:
          model: kilo/inclusionai/ling-3.2-flash:free
          prompt: |
            ${{ env.REVIEW_PROMPT }}

            End your comment with this exact footnote:
            ---
            > 🤖 **Reviewer:** `kilo/inclusionai/ling-3.2-flash:free` (`3/4`) · ⏱️ **Duration:** `<approx elapsed or N/A>` · 🪙 **Tokens:** `<count if exposed, else N/A>`

      - id: rev4
        name: Review (4/4 — Kilo Nemotron 3.5 Super VL Free)
        if: steps.rev1.outcome != 'success' && steps.rev2.outcome != 'success' && steps.rev3.outcome != 'success' && env.HAS_KILO == '1'
        continue-on-error: true
        timeout-minutes: 5
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
        with:
          model: kilo/nvidia/nemotron-3.5-super-vl:free
          prompt: |
            ${{ env.REVIEW_PROMPT }}

            End your comment with this exact footnote:
            ---
            > 🤖 **Reviewer:** `kilo/nvidia/nemotron-3.5-super-vl:free` (`4/4`) · ⏱️ **Duration:** `<approx elapsed or N/A>` · 🪙 **Tokens:** `<count if exposed, else N/A>`

      - name: Verify review succeeded
        if: steps.rev1.outcome != 'success' && steps.rev2.outcome != 'success' && steps.rev3.outcome != 'success' && steps.rev4.outcome != 'success'
        run: |
          echo "All review fallback models failed or were skipped."
          exit 1
